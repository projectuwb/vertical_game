<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2A3440" />
    <title>Inkfall</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <style>
      :root {
        --safe-area-top: env(safe-area-inset-top, 0px);
        --safe-area-right: env(safe-area-inset-right, 0px);
        --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-left: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #171e26;
        overscroll-behavior: none;
        touch-action: none;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #app canvas {
        display: block;
      }
      /* Task 5.3 (Accessibility): an explicit, on-brand keyboard-focus ring for every
         /ui screen's real <button>/<input>/<textarea> elements — visible only for
         keyboard/assistive-tech focus (:focus-visible), never on a pointer tap, so it
         never reads as a stray highlight during ordinary touch/mouse play. */
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid #c9a227;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
