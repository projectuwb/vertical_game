<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2A3440" />
    <title>Inkfall</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <style>
      /* Task 7.7, TECH_SPEC.md §7: two OFL fonts, vendored and subset (Latin + digits +
         punctuation) to /src/assets/fonts — no CDN, no network fetch at runtime. Display
         face gets `font-display: block` ("gate numbers must never render in a
         fallback" — Shippori never silently swaps to the system serif once loaded);
         UI gets `swap` (never worth blocking ordinary button/label text on). Licenses:
         OFL-ShipporiMinchoB1.txt / OFL-ZenKakuGothicNew.txt in the same directory. */
      @font-face {
        font-family: 'Shippori Mincho B1';
        src: url('/src/assets/fonts/ShipporiMinchoB1-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Shippori Mincho B1';
        src: url('/src/assets/fonts/ShipporiMinchoB1-ExtraBold.woff2') format('woff2');
        font-weight: 700 800;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Zen Kaku Gothic New';
        src: url('/src/assets/fonts/ZenKakuGothicNew-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Zen Kaku Gothic New';
        src: url('/src/assets/fonts/ZenKakuGothicNew-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --safe-area-top: env(safe-area-inset-top, 0px);
        --safe-area-right: env(safe-area-inset-right, 0px);
        --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-left: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #171e26;
        overscroll-behavior: none;
        touch-action: none;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #app canvas {
        display: block;
      }
      /* Task 5.3 (Accessibility): an explicit, on-brand keyboard-focus ring for every
         /ui screen's real <button>/<input>/<textarea> elements — visible only for
         keyboard/assistive-tech focus (:focus-visible), never on a pointer tap, so it
         never reads as a stray highlight during ordinary touch/mouse play. */
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid #c9a227;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
